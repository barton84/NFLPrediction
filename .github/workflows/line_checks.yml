name: Line checks

# DraftKings, FanDuel and Caesars spreads, 8 times a day, using the same
# ODDS_API_KEY secret as the morning build. 1 credit per run, about 250 a month.
# Also pulls Circa and Pinnacle history from OddsPapi (ODDSPAPI_KEY) on
# Wednesday and shortly before each kickoff, about 165 of its 250 free
# requests a month.
# Times are UTC. In Central time (after Nov 1): 9:40a, 11:20a, 1:10p, 2:50p,
# 4:40p, 6:30p, 8:30p, 10:30p. The 11:20 and 2:50 checks land just before the
# Sunday noon and 3:25 kickoffs, and 6:30 just before night games.
on:
  schedule:
    - cron: "40 15 * * *"
    - cron: "20 17 * * *"
    - cron: "10 19 * * *"
    - cron: "50 20 * * *"
    - cron: "40 22 * * *"
    - cron: "30 0 * * *"
    - cron: "30 2 * * *"
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Test the Circa / Pinnacle feed only (prints what OddsPapi sends, saves nothing)"
        type: boolean
        default: false
      pull_now:
        description: "Pull Circa / Pinnacle for every upcoming game now (about 1 request per game)"
        type: boolean
        default: false

permissions:
  contents: write

# Same group as the morning build, so the two never write files at the same time
concurrency:
  group: update-model
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install numpy

      - name: Test Circa / Pinnacle feed
        if: ${{ inputs.probe }}
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python pipeline/sharp_lines.py --probe

      - name: Check DraftKings, FanDuel and Caesars spreads
        if: ${{ !inputs.probe }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python pipeline/intraday.py

      # Circa and Pinnacle history (Wednesday and shortly before each kickoff).
      # A problem here never stops the DraftKings checks from saving.
      - name: Circa / Pinnacle history
        if: ${{ !inputs.probe }}
        continue-on-error: true
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python pipeline/sharp_lines.py ${{ inputs.pull_now && '--now' || '' }}

      - name: Commit updated lines
        if: ${{ !inputs.probe }}
        run: |
          git config user.name "model-bot"
          git config user.email "model-bot@users.noreply.github.com"
          git add site/data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Line check $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
